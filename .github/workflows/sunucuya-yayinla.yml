name: sunucuya-yayinla
# Her pull request'te ve main'e her gönderimde testleri çalıştırır.
# main'de testler geçerse imajı derler, ghcr.io'ya yükler ve kendi sunucuda servisi günceller.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency: sunucuya-yayinla-${{ github.ref }}
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tarayıcı testleri (test/ui.test.js) için; Playwright yoksa o testler atlanır.
      - name: Playwright ve Chromium kur
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - run: npm test

      - name: Bağımlılık güvenlik taraması
        run: npm audit --omit=dev --audit-level=high

  yayinla:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      # İsteğe bağlı: sunucunun tam known_hosts satırları. Tanımlı değilse
      # sunucunun ED25519 anahtarı aşağıdaki parmak iziyle doğrulanır.
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      # Sunucunun SSH anahtar parmak izi (gizli değildir). Sunucu yeniden
      # kurulup anahtarı değişirse burası güncellenmeli.
      SERVER_HOST_KEY_SHA256: "SHA256:26TB8Yn9LPg7O1b1pP/cPnx0ftW44Say2PDzorBnJL8"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sudekazan/erdalkazan:latest
            ghcr.io/sudekazan/erdalkazan:${{ github.sha }}

      - name: Sunucuda güncelle
        run: |
          if [ -z "$SERVER_IP" ]; then echo "SERVER_IP tanımlı değil, sunucu adımı atlandı"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$SERVER_IP" 2>/dev/null > ~/.ssh/sunucu-anahtari
            fp=$(ssh-keygen -lf ~/.ssh/sunucu-anahtari 2>/dev/null | awk '{print $2}')
            if [ "$fp" != "$SERVER_HOST_KEY_SHA256" ]; then
              echo "::error::Sunucunun SSH anahtarı beklenen parmak iziyle eşleşmiyor (gelen: ${fp:-alınamadı}). Sunucu yeniden kurulduysa iş akışındaki SERVER_HOST_KEY_SHA256 değerini güncelleyin."
              exit 1
            fi
            cp ~/.ssh/sunucu-anahtari ~/.ssh/known_hosts
          fi
          printf 'Host srv\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$SERVER_IP" > ~/.ssh/config
          # Geçici token ile giriş, iş bitince çıkış (süresi dolmuş giriş bilgisi kalmasın)
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh srv 'docker login ghcr.io -u sudekazan --password-stdin'
          ssh srv 'cd /srv/sunucu && if docker compose config --services | grep -qx erdalkazan; then docker compose pull erdalkazan && docker compose up -d erdalkazan; else echo "erdalkazan servisi sunucuda henüz tanımlı değil, atlandı"; fi; docker logout ghcr.io'

      - name: Sunucuda site durumunu kontrol et
        if: env.SERVER_IP != ''
        run: ssh srv 'bash -s' < .github/scripts/sunucu-durum.sh
